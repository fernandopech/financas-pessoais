# Mantém o projeto Supabase (plano gratuito) ativo: o Supabase pausa
# projetos sem atividade por 7 dias. Faz uma leitura leve 2x por semana.
# Chave publishable (pública): só consegue chamar public.ping(); todas as tabelas têm RLS.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 12 * * 1,4' # segunda e quinta, 09:17 em Brasília
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta leve no banco
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -X POST "$SUPABASE_URL/rest/v1/rpc/ping" -H "Content-Type: application/json" -d "{}" \
            -H "apikey: $SUPABASE_KEY")
          echo "HTTP $status"
          test "$status" = "200"
